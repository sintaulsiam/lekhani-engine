# .github/workflows/ci.yml
name: Engine CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  clippy:
    name: "Clippy Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --all -- --check

  test-and-guard:
    name: "Workspace Tests & Baseline Guard"
    runs-on: ubuntu-latest
    needs: clippy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Hermetic Dictionary SHA-256 Hash
        run: |
          echo "8a51b4d98bcbe147771751c60fa1d2919a84b0b910232bdcf863617ecc88fbdb  data/dictionaries/dictionary.json" | sha256sum --check
      - name: Run workspace unit and regression tests
        run: cargo test --workspace --release

