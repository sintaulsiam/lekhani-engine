[workspace]
members = [
    "lekhani-parser",
    "lekhani-core",
    "lekhani-ai",
]
resolver = "2"

[workspace.package]
version      = "1.1.0"
authors      = ["Sintaul Mahdi Siam <sintaulsiam@gmail.com>"]
edition      = "2021"
license      = "GPL-3.0-or-later"
repository   = "https://github.com/sintaulsiam/lekhani-engine"
homepage     = "https://github.com/sintaulsiam/lekhani-engine"

[workspace.dependencies]
thiserror          = "1.0"
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
hashbrown          = { version = "0.14", features = ["serde", "rayon"] }
tracing            = "0.1"
unicode-segmentation = "1.11"
rayon              = "1.8"
anyhow             = "1.0"
memmap2            = "0.9"
edit-distance      = "2.1"
chrono             = { version = "0.4", default-features = false, features = ["clock", "std"] }
bincode            = "1.3"
lekhani-parser     = { version = "1.1.0", path = "lekhani-parser" }
lekhani-ai         = { version = "1.1.0", path = "lekhani-ai" }
lekhani-core       = { version = "1.1.0", path = "lekhani-core" }
